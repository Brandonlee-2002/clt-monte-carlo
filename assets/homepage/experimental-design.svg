<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
<title>experimental-design.svg</title>
<desc>Evidence visual from the CLT Monte Carlo simulation project.</desc>
<rect x="0" y="0" width="1200" height="300" rx="0" fill="#f7fafc" stroke="none" stroke-width="0" opacity="1"/>
<text x="60" y="44" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">One experiment, repeated across every population</text>
<text x="60" y="70" fill="#52606d" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="alphabetic" opacity="1">A common design makes the cross-distribution comparison defensible.</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/></marker></defs>
<rect x="60" y="105" width="180" height="118" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1" opacity="1"/>
<text x="78" y="132" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">01</text>
<text x="78" y="162" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Choose a population</text>
<text x="78" y="187" fill="#52606d" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="alphabetic" opacity="1">11 shapes and processes</text>
<line x1="246" y1="164" x2="275" y2="164" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="285" y="105" width="180" height="118" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1" opacity="1"/>
<text x="303" y="132" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">02</text>
<text x="303" y="162" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Draw a sample</text>
<text x="303" y="187" fill="#52606d" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Candidate n = 2–500</text>
<line x1="471" y1="164" x2="500" y2="164" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510" y="105" width="180" height="118" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1" opacity="1"/>
<text x="528" y="132" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">03</text>
<text x="528" y="162" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Calculate the mean</text>
<text x="528" y="187" fill="#52606d" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="alphabetic" opacity="1">One mean per sample</text>
<line x1="696" y1="164" x2="725" y2="164" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="735" y="105" width="180" height="118" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1" opacity="1"/>
<text x="753" y="132" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">04</text>
<text x="753" y="162" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Repeat 10,000 times</text>
<text x="753" y="187" fill="#52606d" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Monte Carlo sampling</text>
<line x1="921" y1="164" x2="950" y2="164" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="960" y="105" width="180" height="118" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1" opacity="1"/>
<text x="978" y="132" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">05</text>
<text x="978" y="162" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="alphabetic" opacity="1">Apply the same screen</text>
<text x="978" y="187" fill="#52606d" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="alphabetic" opacity="1">4 diagnostics + stability</text>
</svg>
