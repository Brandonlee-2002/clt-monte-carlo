name: Test and render project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore R environment
        uses: r-lib/actions/setup-renv@v2

      - name: Run statistical core tests
        run: Rscript tests/test_helpers.R

      - name: Run analytic validation
        run: Rscript R/run_validation.R

      - name: Render Quarto site
        run: quarto render --no-clean --cache-refresh
